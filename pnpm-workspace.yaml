# docs-site も同じ workspace に入れる（lockfile を 1 本にする）。audit も docs の依存まで見る。
packages:
  - "docs-site"

# audit から外す勧告。外すのは、上流が修正版を受け取れず、override でも越えられないものだけ。
# 1 件ごとに、なぜ越えられないかと、外す条件を書く。
auditConfig:
  ignoreGhsas:
    # minimatch: globparts の増幅による DoS。修正は 11.0.1 からで、10 系には無い。
    # 11 は名前付きの書き出し makeRe をやめたので、override で 11 にすると eslint-plugin-import-x が
    # 読み込みで落ちる（browserhive の #798 で実測）。eslint 10.14・@eslint/config-array 0.23・
    # import-x 4.17 の最新版が、どれも 11 を受けない（^10 まで。2026-11-05 に npm view で確かめた）。
    # 木の中の minimatch が読むのは、ESLint の設定と lint の対象（この repo の物）だけ。
    # 外す条件: これらの親が ^11 を要求する版を出したとき（そのとき update で直る）。
    - GHSA-g3hv-75wg-m249
    # picomatch: 単一の枝を繰り返す extglob (`+(*)` など) の ReDoS (high)。
    # 勧告の範囲は <= 4.0.7 で 2 系も含み、直った版はまだ無い (2026-11-18 の時点で npm の
    # 最新は 4.0.7。直しの PR は micromatch/picomatch の #265〜#273 で未 merge)。上げる先が
    # 無いので、lockfile の更新でも override でも越えられない。
    # 要求元は astro・@astrojs/internal-helpers・vite・vitest・tinyglobby・fdir・anymatch (2.3.2)。
    # `pnpm audit --prod` で残る経路は docs-site の Starlight の下だけで、docs は静的な HTML
    # として出る。picomatch が読むパターンは、build と試験の間のこの repo の設定と、
    # Astro・vite の内部の物だけで、外の入力は入らない。
    # 外す条件: 勧告に直った版 (first_patched_version) が載ったとき。
    # `pnpm update picomatch -r --depth Infinity` で上げ、この行を消しても `pnpm audit` が 0 に
    # なれば消す (CAPTURE-478)。
    - GHSA-fc5q-39xc-vjpf
