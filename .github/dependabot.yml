# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Dependabot が読むのは default branch（main）に在るこの file だけ。PR も main へ出す。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 版が枯れてから PR にする（supply-chain 対策）。security の更新には効かない
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 3
    versioning-strategy: increase
    ignore:
      # typescript は major を上げない。typescript-eslint の peer が TS 7 を含まず
      # （2026-11-05 の 8.72.1 で `>=4.8.4 <6.1.0`）、上げると lint が必ず落ちる。
      # 対応版が出たら、この entry を消す。確かめ方:
      #   npm view typescript-eslint@latest peerDependencies.typescript
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      development-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # github-actions は default-days だけに対応
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
