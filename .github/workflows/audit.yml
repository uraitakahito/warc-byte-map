name: audit

# 既知の脆弱性の関所（package.json の audit。check の最初の段と同じ命令）。
# 勧告は PR と無関係に出るので、毎日も走らせる。schedule と workflow_dispatch は、
# default branch（main）に在る workflow だけを走らせる。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # install しない。audit は lockfile だけを読む。env の行が、それを本当にする:
      # pnpm 11 は node_modules が無いと `pnpm run` の前に依存を入れる
      # （verifyDepsBeforeRun の既定が install）。
      - name: Audit the lockfile
        run: pnpm run audit
        env:
          pnpm_config_verify_deps_before_run: "false"
